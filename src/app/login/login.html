<h1>Farm MANAGEMENT SYSTEM</h1>
<form [formGroup]="LoginForm" (ngSubmit)="onsubmit()">
    <p>
        <label for="mail">Email:</label>
        <input type="email" id="mail" name="mail" formControlName="Email" placeholder="Enter the mail">
    <div
        *ngIf="LoginForm.controls.Email.invalid && (LoginForm.controls.Email.touched || LoginForm.controls.Email.dirty)">
        <span *ngIf="LoginForm.controls.Email.errors?.['required']">Email is required</span>
        <span *ngIf="LoginForm.controls.Email.errors?.['email']">Please enter a valid email format (e.g.,
            name@email.com)</span>
    </div>
    <p>
        <label for="password">PassWord:</label>
        <input type="password" id="password" name="password" formControlName="Password">
    <div
        *ngIf="!LoginForm.controls.Password.valid&&(LoginForm.controls.Password.touched||LoginForm.controls.Password.dirty)">
          <span *ngIf="LoginForm.controls.Password.errors?.['required']">password is required</span>
        <span *ngIf="LoginForm.controls.Password.errors?.['minlength']">Please enter alteast 6 character </span>
        </div>

        
        <p>
            <button type="submit">Login</button>
        </p>
</form>
